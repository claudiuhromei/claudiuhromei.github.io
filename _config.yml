# Site configuration. Restart `jekyll serve` after editing this file.

theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "default"

# Site settings
locale: "en-US"
title: "Claudiu Daniel Hromei"
title_separator: "|"
name: "Claudiu Daniel Hromei"
description: >-
  Senior AI Scientist and AI researcher (Ph.D. in AI) working on NLP, Large Language Models,
  multimodal grounding and agentic AI, bridging research and enterprise-grade solutions.
url: "https://claudiuhromei.github.io"
baseurl: ""
repository: "claudiuhromei/claudiuhromei.github.io"
words_per_minute: 200
breadcrumbs: false
search: false
comments:
  provider: false

# Site author (sidebar on every page). Further profile links are added once confirmed.
author:
  name: "Claudiu Daniel Hromei"
  bio: "Senior AI Scientist · AI Researcher · NLP & LLMs"
  location: "Rome, Italy"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/cdhromei/"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.it/citations?user=YQRKKFoAAAAJ"
    - label: "Hugging Face"
      icon: "fas fa-fw fa-link"
      url: "https://huggingface.co/cdh"

# Reading files
include:
  - _pages
exclude:
  - .bundle
  - .github
  - .jekyll-cache
  - .sass-cache
  - .venv
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - Rakefile
  - README.md
  - roadmap.md
  - test
  - vendor

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Europe/Rome

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-sitemap

# Front matter defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      share: false
      related: false
