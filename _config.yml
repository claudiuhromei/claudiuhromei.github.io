# Site configuration. Restart `jekyll serve` after editing this file.

theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "default"
# Skin applied automatically when the visitor's OS uses a dark colour scheme.
minimal_mistakes_dark_skin: "dark"

# Site settings
locale: "en-US"
title: "Claudiu Daniel Hromei"
title_separator: "|"
name: "Claudiu Daniel Hromei"
description: >-
  Senior AI Scientist and AI researcher (Ph.D. in AI) working on NLP, Large Language Models,
  multimodal grounding and agentic AI, bridging research and enterprise-grade solutions.
url: "https://claudiuhromei.github.io"
baseurl: ""
repository: "claudiuhromei/claudiuhromei.github.io"
words_per_minute: 200
breadcrumbs: false
search: false
comments:
  provider: false

# SEO and social previews
og_image: /assets/images/og-image.png
# Generated from the profile photo by tools/make_og_image.py: run it again when the photo or headline changes.
og_image_alt: "Photo of Claudiu Daniel Hromei next to the name and headline: Senior AI Scientist and AI Researcher"
social:
  type: Person
  name: "Claudiu Daniel Hromei"
  links:
    - "https://www.linkedin.com/in/cdhromei/"
    - "https://scholar.google.it/citations?user=YQRKKFoAAAAJ"
    - "https://orcid.org/0009-0000-8204-5023"
    - "https://dblp.org/pid/309/5387.html"
    - "https://www.semanticscholar.org/author/2148228904"
    - "https://aclanthology.org/people/claudiu-daniel-hromei/"
    - "https://huggingface.co/cdh"
    - "https://openreview.net/profile?id=%7EClaudiu_Daniel_Hromei1"

# Research group at the University of Rome Tor Vergata, linked wherever the site mentions the collaboration.
# The group's site has no HTTPS version (allowed in the Rakefile's link check).
sag_group_url: "http://sag.art.uniroma2.it/people"

# Analytics: GoatCounter site code (the "code" in https://code.goatcounter.com).
# Set to "" to disable; the script is only added to production builds.
goatcounter_code: "claudiuhromei"

# Site author (sidebar on every page). Icons are Font Awesome classes (the theme loads the latest free
# release); sites without a brand icon (Scholar, DBLP, OpenReview, ...) use a generic one.
author:
  name: "Claudiu Daniel Hromei"
  bio: "Senior AI Scientist · AI Researcher · NLP & LLMs"
  location: "Rome, Italy"
  avatar: "/assets/images/profile.jpg"
  # Email, never in plain text: user and domain parts written backwards, joined by assets/js/contact.js.
  contact:
    user_reversed: "iemorh.dc"
    domain_reversed: "moc.liamg"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/cdhromei/"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.it/citations?user=YQRKKFoAAAAJ"
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0009-0000-8204-5023"
    - label: "DBLP"
      icon: "fas fa-fw fa-database"
      url: "https://dblp.org/pid/309/5387.html"
    - label: "Semantic Scholar"
      icon: "fas fa-fw fa-book-open"
      url: "https://www.semanticscholar.org/author/2148228904"
    - label: "ACL Anthology"
      icon: "fas fa-fw fa-file-lines"
      url: "https://aclanthology.org/people/claudiu-daniel-hromei/"
    - label: "OpenReview"
      icon: "fas fa-fw fa-comments"
      url: "https://openreview.net/profile?id=%7EClaudiu_Daniel_Hromei1"
    - label: "Hugging Face"
      icon: "fab fa-fw fa-hugging-face"
      url: "https://huggingface.co/cdh"

# Reading files
include:
  - _pages
exclude:
  - .bundle
  - .github
  - BLOGGING.md
  - SITE_GUIDE.md
  - .jekyll-cache
  - .sass-cache
  - .venv
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - Rakefile
  - README.md
  - roadmap.md
  - test
  - tools
  - browser_tests
  - vendor

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Europe/Rome

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-scholar
  - jekyll-sitemap

# Publications (/publications/) are generated from assets/bibliography/publications.bib.
scholar:
  style: apa
  locale: en
  source: ./assets/bibliography
  bibliography: publications.bib
  bibliography_template: bib
  sort_by: year,month
  order: descending
  group_by: year
  group_order: descending
  replace_strings: true
  # Fields left out of the BibTeX shown under "Cite" (site-only fields and the long abstract).
  bibtex_skip_fields: [abstract, pdf, code, video, slides, poster, award, selected]
  join_strings: true

# Front matter defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      show_date: false
      share: false
      related: false
  - scope:
      path: ""
      type: blog
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      share: true
      related: false
      toc: true
      toc_sticky: true

# Technical blog: one Markdown file per post in _blog/. Hidden for now: `output: false` keeps the posts out
# of the site and _pages/blog.md is not published. To launch it, see the owner's local notes.
collections:
  blog:
    output: false
    permalink: /blog/:year/:month/:title/
