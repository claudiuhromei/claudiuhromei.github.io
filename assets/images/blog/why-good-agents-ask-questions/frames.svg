<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>The verb "take" evokes different FrameNet frames</title>
  <desc>The lexical unit take.v can evoke, among others, the frames TAKING and BRINGING. Each frame defines its own frame elements. The same sentence annotated with TAKING marks "on the bed" as the Source; annotated with BRINGING it marks "on the bed" as the Goal.</desc>
  <rect width="680" height="330" fill="#fff"/>

  <!-- lexical unit -->
  <rect x="265" y="16" width="150" height="40" rx="20" fill="#1f2328"/>
  <text x="340" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">take.v</text>
  <text x="425" y="41" font-size="13" fill="#57606a">evokes Taking, Bringing, Removing, …</text>
  <line x1="300" y1="56" x2="175" y2="96" stroke="#57606a" stroke-width="2"/>
  <line x1="380" y1="56" x2="505" y2="96" stroke="#57606a" stroke-width="2"/>

  <!-- TAKING frame -->
  <rect x="20" y="96" width="310" height="104" rx="8" fill="#f6f8fa" stroke="#1f2328"/>
  <text x="36" y="122" font-size="15" font-weight="700" fill="#006b3f">Frame: TAKING</text>
  <text x="36" y="144" font-size="13" fill="#1f2328">An Agent takes a Theme from a Source,</text>
  <text x="36" y="162" font-size="13" fill="#1f2328">so that the Agent holds it.</text>
  <text x="36" y="186" font-size="13" fill="#57606a">Core elements: Agent · Theme · Source</text>

  <!-- BRINGING frame -->
  <rect x="350" y="96" width="310" height="104" rx="8" fill="#f6f8fa" stroke="#1f2328"/>
  <text x="366" y="122" font-size="15" font-weight="700" fill="#006b3f">Frame: BRINGING</text>
  <text x="366" y="144" font-size="13" fill="#1f2328">An Agent moves a Theme to a Goal,</text>
  <text x="366" y="162" font-size="13" fill="#1f2328">carrying it along.</text>
  <text x="366" y="186" font-size="13" fill="#57606a">Core elements: Agent · Theme · Goal · …</text>

  <!-- annotated sentences -->
  <g font-size="15">
    <text x="20" y="240" fill="#1f2328">[<tspan font-weight="700">take</tspan>]<tspan fill="#57606a" font-size="11" dy="4">TARGET</tspan><tspan dy="-4"> [the phone]</tspan><tspan fill="#57606a" font-size="11" dy="4">Theme</tspan><tspan dy="-4"> [on the bed]</tspan><tspan fill="#006b3f" font-weight="700" font-size="11" dy="4">Source</tspan></text>
    <text x="20" y="262" font-size="12" fill="#57606a">“on the bed” describes the phone: pick it up from there</text>
    <text x="20" y="298" fill="#1f2328">[<tspan font-weight="700">take</tspan>]<tspan fill="#57606a" font-size="11" dy="4">TARGET</tspan><tspan dy="-4"> [the phone]</tspan><tspan fill="#57606a" font-size="11" dy="4">Theme</tspan><tspan dy="-4"> [on the bed]</tspan><tspan fill="#006b3f" font-weight="700" font-size="11" dy="4">Goal</tspan></text>
    <text x="20" y="320" font-size="12" fill="#57606a">“on the bed” is the destination: carry the phone there</text>
  </g>
  <text x="660" y="240" text-anchor="end" font-size="13" font-weight="700" fill="#006b3f">TAKING</text>
  <text x="660" y="298" text-anchor="end" font-size="13" font-weight="700" fill="#006b3f">BRINGING</text>
</svg>
