{%- comment -%} One line of a news list: month, linked title. Usage: {% include news-item.html post=post %} {%- endcomment -%}
<time class="news-list__date" datetime="{{ include.post.date | date: '%Y-%m' }}">{{ include.post.date | date: "%b %Y" }}</time>
<a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a>
