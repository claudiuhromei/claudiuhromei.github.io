{%- comment -%}
  Email link for the author sidebar (see contact-link.html). It is a link and not a <button> because the theme
  hides sidebar buttons on wide screens.
{%- endcomment -%}
{%- assign contact = site.author.contact -%}
{%- if contact.user_reversed and contact.domain_reversed %}
<li>
  {% include contact-link.html text="Email" icon="fas fa-fw fa-envelope" %}
</li>
{%- endif %}
